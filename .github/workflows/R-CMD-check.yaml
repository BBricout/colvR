name: R-CMD-check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: ubuntu-latest,  r: 'release' }
          - { os: ubuntu-latest,  r: 'devel' }
          - { os: ubuntu-latest,  r: 'oldrel-1' }
          - { os: macos-latest,   r: 'release' }
          - { os: windows-latest, r: 'release' }

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      # --- System deps for NLopt ---
      - name: Install system NLopt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libnlopt-dev

      - name: Install system NLopt (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install nlopt || true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::Rcpp
            any::RcppArmadillo
            any::nloptr
          needs: check

      # --- Debug: print flags + Makevars to logs ---
      - name: Debug nloptr flags + Makevars
        run: |
          Rscript -e "cat('nloptr version: ', as.character(packageVersion('nloptr')), '\n')"
          Rscript -e "cat('CFlags: ', nloptr:::CFlags(), '\n')"
          Rscript -e "cat('LdFlags:', nloptr:::LdFlags(), '\n')"
          echo '--- src/Makevars ---'
          sed -n '1,200p' src/Makevars || true
          echo '--- src/Makevars.win ---'
          sed -n '1,200p' src/Makevars.win || true

      - name: Check
        uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual","--as-cran","--no-build-vignettes")'
          error-on: '"error"'


